<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raccoon Racing - Recycling Challenge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameCanvas {
      border: 4px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 100, 0.3);
      image-rendering: pixelated;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'menu';
    // Load coins properly so they accumulate across sessions
    let coins = parseInt(localStorage.getItem('raccoonCoins')) || 0;
    let selectedSkin = localStorage.getItem('raccoonSelectedSkin') || 'default';
    let selectedMap = 'london';

    function saveGame() {
      localStorage.setItem('raccoonCoins', coins);
      localStorage.setItem('raccoonSelectedSkin', selectedSkin);
    }

    // ─── MUSIC SYSTEM ───────────────────────────────────────────────────────────
    let audioCtx = null;
    let musicEnabled = localStorage.getItem('raccoonMusic') !== 'off';
    let musicNodes = [];
    let musicPlaying = false;
    let currentTrack = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function stopMusic() {
      musicNodes.forEach(n => { try { n.stop(); } catch(e){} });
      musicNodes = [];
      musicPlaying = false;
      currentTrack = null;
    }

    // Tiny chiptune engine: plays a looping sequence of notes
    function playTrack(trackName) {
      if (!musicEnabled) return;
      if (currentTrack === trackName && musicPlaying) return;
      stopMusic();
      currentTrack = trackName;
      musicPlaying = true;

      const ctx = getAudioCtx();

      masterGain.gain.value = 0.18;
      masterGain.connect(ctx.destination);

          ]

        question: {
          bpm: 190,
          melody: [
            [659,1],[0,1],[659,1],[0,1],[698,1],[659,1],[0,1],[622,1],
            [659,2],[0,2],[587,1],[0,1],[622,1],[0,1],
            [659,1],[0,1],[698,1],[0,1],[784,1],[698,1],[659,1],[622,1],
            [659,4],[0,4]
          ],
          bass: [
            [165,1],[0,1],[165,1],[0,1],[175,1],[165,1],[0,1],[156,1],
            [165,2],[0,2],[147,1],[0,1],[156,1],[0,1],
            [165,1],[0,1],[175,1],[0,1],[196,1],[175,1],[165,1],[156,1],
            [165,4],[0,4]
          ],
          arpegg: [
            [330,1],[494,1],[659,1],[494,1],[330,1],[494,1],[659,1],[494,1],
            [311,1],[466,1],[622,1],[466,1],[311,1],[466,1],[622,1],[466,1]
          ]
        },
        // Triumphant fanfare — 210 BPM explosive celebration
        victory: {
          bpm: 210,
          melody: [
            [784,1],[784,1],[784,1],[0,1],[784,1],[1047,1],[659,1],[0,1],
            [784,1],[784,1],[784,1],[0,1],[880,1],[880,1],[784,1],[0,1],
            [784,1],[784,1],[784,1],[0,1],[784,1],[1047,1],[659,1],[784,1],
            [880,2],[1047,2],[880,1],[784,1],[698,1],[659,1],[784,4]
          ],
          bass: [
            [196,2],[196,2],[220,2],[196,2],
            [196,2],[220,2],[247,2],[220,2],
            [196,2],[196,2],[220,2],[196,2],
            [220,2],[247,2],[262,2],[196,4]
          ],
          arpegg: [
            [392,1],[523,1],[659,1],[523,1],[392,1],[523,1],[659,1],[523,1],
            [440,1],[587,1],[698,1],[587,1],[440,1],[587,1],[698,1],[587,1]
          ]
        },
        // Slow dramatic collapse — 75 BPM descending doom
        gameover: {
          bpm: 75,
          melody: [
            [523,2],[494,2],[466,2],[440,2],
            [415,2],[392,2],[370,2],[349,4],
            [330,2],[311,2],[294,2],[277,4],[0,4]
          ],
          bass: [
            [131,4],[123,4],[110,4],[98,4],[87,4],[82,4],[73,8]
          ],
          arpegg: [
            [262,2],[247,2],[233,2],[220,2],
            [208,2],[196,2],[185,2],[175,4]
          ]
        }
      };

      const track = tracks[trackName] || tracks.menu;
      const beatDur = 60 / track.bpm;

      function scheduleVoice(notes, waveType, gainVal, detune = 0) {
        const g = ctx.createGain();
        g.gain.value = gainVal;
        g.connect(masterGain);

        let t = ctx.currentTime + 0.05;
        const loopDur = notes.reduce((s, [,d]) => s + d * beatDur, 0);

        function scheduleLoop(startT) {
          let cur = startT;
          notes.forEach(([freq, dur]) => {
            const d = dur * beatDur;
            if (freq > 0) {
              const osc = ctx.createOscillator();
              const env = ctx.createGain();
              osc.type = waveType;
              osc.frequency.value = freq;
              osc.detune.value = detune;
              env.gain.setValueAtTime(0, cur);
              env.gain.linearRampToValueAtTime(1, cur + 0.01);
              env.gain.setValueAtTime(0.8, cur + d * 0.6);
              env.gain.linearRampToValueAtTime(0, cur + d * 0.95);
              osc.connect(env);
              env.connect(g);
              osc.start(cur);
              osc.stop(cur + d);
              musicNodes.push(osc);
            }
            cur += d;
          });
          // Schedule next loop
          const loopNode = ctx.createOscillator();
          loopNode.frequency.value = 0;
          loopNode.start(startT);
          loopNode.stop(startT + loopDur);
          loopNode.onended = () => {
            if (musicPlaying && currentTrack === trackName) scheduleLoop(startT + loopDur);
          };
          loopNode.connect(ctx.createGain()); // avoid unused node warning
          musicNodes.push(loopNode);
        }
        scheduleLoop(t);
      }

      scheduleVoice(track.melody, 'square', 0.55);
      scheduleVoice(track.bass,   'sawtooth', 0.45);
      scheduleVoice(track.arpegg, 'triangle', 0.3, -5);
    }

    function toggleMusic() {
      musicEnabled = !musicEnabled;
      localStorage.setItem('raccoonMusic', musicEnabled ? 'on' : 'off');
      if (musicEnabled) {
        playMusicForState(gameState);
      } else {
        stopMusic();
      }
    }

    function playMusicForState(state) {
      if (!musicEnabled) return;
      if (state === 'menu' || state === 'mapSelect' || state === 'garage') playTrack('menu');
      else if (state === 'playing' || state === 'countdown') playTrack('racing');
      else if (state === 'question' || state === 'sorting') playTrack('question');
      else if (state === 'victory') playTrack('victory');
      else if (state === 'gameOver') playTrack('gameover');
      else if (state === 'paused') { /* keep current */ }
    }

    // ─── MUSIC BUTTON ────────────────────────────────────────────────────────────
    function drawMusicButton() {
      const bx = 358, by = 570, bw = 36, bh = 24;
      ctx.fillStyle = musicEnabled ? 'rgba(74,222,128,0.9)' : 'rgba(80,80,80,0.85)';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 6);
      ctx.fill();
      ctx.strokeStyle = musicEnabled ? 'rgba(0,200,80,0.7)' : 'rgba(150,150,150,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 6);
      ctx.stroke();
      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(musicEnabled ? '🔊' : '🔇', bx + bw / 2, by + bh - 5);
      ctx.textAlign = 'left';
    }
    // ────────────────────────────────────────────────────────────────────────────

    const skins = {
      default: { name: 'Default', price: 0, color: '#4ade80' },
      neon: { name: 'Neon Green', price: 300, color: '#00ff00' },
      pink: { name: 'Hot Pink', price: 600, color: '#ff69b4' },
      blue: { name: 'Ocean Blue', price: 1200, color: '#00bfff' },
      sunset: { name: 'Sunset', price: 1500, color: '#ff6347' },
    //   galaxy: { name: 'Galaxy', price: 2000, color: '#9400d3' },
      gold: { name: 'Gold Edition', price: 3000, color: '#ffd700' },
      rainbow: { name: 'Rainbow', price: 5000, color: 'rainbow' }
    };

    const maps = {
      london: { name: 'London', lives: 5, questions: 6, checkpoints: 3, questionsPerCheckpoint: 2, checkpointInterval: 30000, difficulty: 'Easy', completionBonus: 20, bg: '#2d5a27', road: '#444', accent: '#c41e3a' },
      tokyo: { name: 'Tokyo', lives: 3, questions: 6, checkpoints: 3, questionsPerCheckpoint: 2, checkpointInterval: 30000, difficulty: 'Medium', completionBonus: 50, bg: '#1a0a2e', road: '#222', accent: '#ff1493' },
      paris: { name: 'Paris', lives: 1, questions: 6, checkpoints: 3, questionsPerCheckpoint: 2, checkpointInterval: 30000, difficulty: 'Hard', completionBonus: 80, bg: '#1e3a5f', road: '#333', accent: '#ffd700' }
    };

    const allQuestions = [
      { item: '🥤 Plastic Bottle', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🍌 Banana Peel', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🔋 Used Battery', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '📰 Newspaper', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🍕 Pizza Box (greasy)', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '💡 Light Bulb', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🥚 Egg Shells', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '📦 Cardboard Box', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🎨 Paint Can', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🍎 Apple Core', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🥫 Aluminum Can', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '☕ Coffee Grounds', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '💊 Expired Medicine', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🍃 Yard Waste', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '📱 Old Phone', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🍞 Stale Bread', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🧴 Shampoo Bottle', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },

      { item: '🖨️ Ink Cartridge', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '👕 Old T-Shirt', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🧈 Butter Wrapper', correct: 'landfill', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🍳 Cooking Oil', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '📚 Old Books', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🧹 Broken Broom', correct: 'landfill', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🥜 Peanut Shells', correct: 'compost', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '💻 Old Laptop', correct: 'hazardous', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] },
      { item: '🧃 Juice Box', correct: 'recycle', options: ['Recycle', 'Compost', 'Landfill', 'Hazardous'] }
    ];

    let player = { x: 0, lane: 1, y: 500 };
    let playerProgress = 0;
    let sessionCoins = 0;
    let lives = 5;
    let maxLives = 5;
    let totalQuestions = 10;
    let questionsAnswered = 0;
    let correctAnswers = 0;
    let playerSpeed = 0.3;
    let roadOffset = 0;
    let trash = [];
    let trashCollected = 0;
    let collectedTrashItems = [];
    
    // Sorting minigame state
    let sortingTimer = 0;
    let sortingScore = 0;
    let sortingCurrentItem = null;
    let sortingItemIndex = 0;
    let sortingFeedback = '';
    let sortingFeedbackTimer = 0;
    
    const trashBinMapping = {
      '🗑️': 'general', '🍔': 'general', '🍕': 'general',
      '🥤': 'plastic', '🛍️': 'plastic', '🧴': 'plastic',
      '📄': 'paper', '📦': 'paper', '📰': 'paper',
      '🍾': 'glass', '🫙': 'glass', '🥛': 'glass'
    };
    
    const sortingBins = [
      { name: 'General', key: 'general', emoji: '🗑️', color: '#666' },
      { name: 'Plastic', key: 'plastic', emoji: '♻️', color: '#3b82f6' },
      { name: 'Paper', key: 'paper', emoji: '📄', color: '#f59e0b' },
      { name: 'Glass', key: 'glass', emoji: '🫙', color: '#22c55e' }
    ];
    
    let nitroPickups = [];
    let currentNitro = 0;
    let nitroActive = false;
    let nitroTimer = 0;
    let checkpointTimer = 0;
    let checkpointY = -100;
    let showCheckpoint = false;
    let currentCheckpoint = 0;
    let questionsAtCurrentCheckpoint = 0;
    let correctAtCheckpoint = 0;
    let checkpointMessage = '';
    let checkpointMessageTimer = 0;
    let questionsPerCheckpoint = 1;
    let checkpointInterval = 13000;
    let totalCheckpoints = 10;
    let currentQuestion = null;
    let questionTimer = 0;
    let invincible = false;
    let invincibleTimer = 0;
    let countdown = 3;
    let countdownTimer = 0;
    let gameQuestions = [];
    let lastTime = 0;
    let menuSelection = 0;
    let garageScroll = 0;
    let boostEffect = 0;
    let stallEffect = 0;

    document.addEventListener('keydown', (e) => {
      if (gameState === 'menu') {
        if (e.key === 'ArrowUp') menuSelection = Math.max(0, menuSelection - 1);
        if (e.key === 'ArrowDown') menuSelection = Math.min(2, menuSelection + 1);
        if (e.key === 'Enter' || e.key === ' ') {
          if (menuSelection === 0) gameState = 'mapSelect';
          else if (menuSelection === 1) { gameState = 'garage'; garageScroll = 0; }
        }
      }
      else if (gameState === 'mapSelect') {
        if (e.key === 'ArrowUp') menuSelection = Math.max(0, menuSelection - 1);
        if (e.key === 'ArrowDown') menuSelection = Math.min(2, menuSelection + 1);
        if (e.key === 'Escape') { gameState = 'menu'; menuSelection = 0; }
        if (e.key === 'Enter' || e.key === ' ') {
          selectedMap = ['london', 'tokyo', 'paris'][menuSelection];
          startGame();
        }
      }
      else if (gameState === 'garage') {
        if (e.key === 'ArrowUp') garageScroll = Math.max(0, garageScroll - 1);
        if (e.key === 'ArrowDown') garageScroll = Math.min(Object.keys(skins).length - 1, garageScroll + 1);
        if (e.key === 'Escape') { gameState = 'menu'; menuSelection = 1; }
        if (e.key === 'Enter' || e.key === ' ') handleGarageSelect();
      }
      else if (gameState === 'playing') {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.lane = Math.max(0, player.lane - 1);
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.lane = Math.min(2, player.lane + 1);
        if (e.key === ' ' && currentNitro > 0 && !nitroActive) activateNitro();
        if (e.key === 'Escape') gameState = 'paused';
      }
      else if (gameState === 'question') {
        if (e.key >= '1' && e.key <= '4') answerQuestion(parseInt(e.key) - 1);
      }
      else if (gameState === 'sorting') {
        if (e.key >= '1' && e.key <= '4') handleSortingBinClick(parseInt(e.key) - 1);
      }
      else if (gameState === 'paused') {
        if (e.key === 'Escape' || e.key === 'Enter') gameState = 'playing';
      }
      else if (gameState === 'gameOver' || gameState === 'victory') {
        if (e.key === 'Enter' || e.key === ' ') { gameState = 'menu'; menuSelection = 0; playMusicForState('menu'); }
      }
    });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (canvas.width / rect.width);
      const y = (e.clientY - rect.top) * (canvas.height / rect.height);
      // Music button (bottom-right corner)
      if (x >= 358 && x <= 394 && y >= 570 && y <= 594) {
        toggleMusic();
        // Unlock AudioContext on first user interaction
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      // Unlock AudioContext on any click
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      handleClick(x, y);
    });

    function handleClick(x, y) {
      if (gameState === 'menu') {
        if (y >= 280 && y <= 320) { menuSelection = 0; gameState = 'mapSelect'; }
        else if (y >= 340 && y <= 380) { menuSelection = 1; gameState = 'garage'; }
      }
      else if (gameState === 'mapSelect') {
        if (x >= 50 && x <= 350) {
          if (y >= 130 && y <= 210) { selectedMap = 'london'; startGame(); }
          else if (y >= 220 && y <= 300) { selectedMap = 'tokyo'; startGame(); }
          else if (y >= 310 && y <= 390) { selectedMap = 'paris'; startGame(); }
        }
        if (y >= 520) { gameState = 'menu'; menuSelection = 0; }
      }
      else if (gameState === 'garage') {
        if (y >= 100 && y <= 500) {
          garageScroll = Math.floor((y - 100) / 55);
          handleGarageSelect();
        }
        if (y >= 540) { gameState = 'menu'; menuSelection = 1; }
      }
      else if (gameState === 'question') {
        if (y >= 310 && y <= 350) answerQuestion(0);
        else if (y >= 360 && y <= 400) answerQuestion(1);
        else if (y >= 410 && y <= 450) answerQuestion(2);
        else if (y >= 460 && y <= 500) answerQuestion(3);
      }
      else if (gameState === 'playing') {
        if (y >= 500) {
          if (x < 133) player.lane = Math.max(0, player.lane - 1);
          else if (x > 267) player.lane = Math.min(2, player.lane + 1);
          else if (currentNitro > 0 && !nitroActive) activateNitro();
        }
      }
      else if (gameState === 'gameOver') {
        if (y >= 400 && y <= 450) { gameState = 'menu'; menuSelection = 0; playMusicForState('menu'); }
      }
      else if (gameState === 'victory') {
        if (y >= 420 && y <= 470) { gameState = 'menu'; menuSelection = 0; playMusicForState('menu'); }
      }
      else if (gameState === 'sorting') {
        const binWidth = 85;
        const binStartX = 20;
        const binY = 380;
        if (y >= binY && y <= binY + 100) {
          for (let i = 0; i < 4; i++) {
            const binX = binStartX + i * (binWidth + 10);
            if (x >= binX && x <= binX + binWidth) {
              handleSortingBinClick(i);
              break;
            }
          }
        }
      }
      else if (gameState === 'paused') {
        if (y >= 280 && y <= 320) gameState = 'playing';
        if (y >= 340 && y <= 380) { gameState = 'menu'; menuSelection = 0; }
      }
    }

    function handleGarageSelect() {
      const skinKeys = Object.keys(skins);
      const skinKey = skinKeys[garageScroll];
      if (skinKey) {
        if (coins >= skins[skinKey].price) {
          selectedSkin = skinKey;
          saveGame();
        }
      }
    }

    function startGame() {
      const map = maps[selectedMap];
      lives = map.lives;
      maxLives = map.lives;
      totalQuestions = map.questions;
      totalCheckpoints = map.checkpoints;
      questionsPerCheckpoint = map.questionsPerCheckpoint;
      checkpointInterval = map.checkpointInterval;
      currentCheckpoint = 0;
      questionsAtCurrentCheckpoint = 0;
      correctAtCheckpoint = 0;
      checkpointMessage = '';
      checkpointMessageTimer = 0;
      questionsAnswered = 0;
      correctAnswers = 0;
      sessionCoins = 0;
      playerProgress = 0;
      playerSpeed = 0.3;
      player.lane = 1;
      player.y = 500;
      roadOffset = 0;
      trash = [];
      trashCollected = 0;
      collectedTrashItems = [];
      nitroPickups = [];
      currentNitro = 0; // Starts at 0 for each session now that boosts aren't purchasable
      saveGame();
      nitroActive = false;
      nitroTimer = 0;
      checkpointTimer = 0;
      showCheckpoint = false;
      invincible = false;
      invincibleTimer = 0;
      boostEffect = 0;
      stallEffect = 0;
      currentQuestion = null;
      countdown = 3;
      countdownTimer = 0;
      gameState = 'countdown';
      playMusicForState('countdown');
      gameQuestions = [...allQuestions].sort(() => Math.random() - 0.5).slice(0, totalQuestions);
    }

    function activateNitro() {
      if (currentNitro > 0 && !nitroActive) {
        currentNitro--;
        nitroActive = true;
        nitroTimer = 3000;
      }
    }

    function showQuestion() {
      if (questionsAnswered < totalQuestions && gameQuestions.length > 0) {
        currentQuestion = gameQuestions[questionsAnswered];
        questionTimer = 8000;
        gameState = 'question';
        playMusicForState('question');
      }
    }

    function answerQuestion(index) {
      if (!currentQuestion) return;
      const correctIndex = currentQuestion.options.findIndex(o => o.toLowerCase() === currentQuestion.correct);
      const isCorrect = index === correctIndex;
      
      if (isCorrect) {
        correctAnswers++;
        correctAtCheckpoint++;
        sessionCoins += 20;
      } else {
        lives--;
        if (lives <= 0) {
          coins += sessionCoins + 5;
          saveGame();
          window.parent.postMessage({ type: 'score', value: coins }, '*');
          gameState = 'gameOver';
          playMusicForState('gameOver');
          return;
        }
      }
      
      questionsAnswered++
      questionsAtCurrentCheckpoint++;
      currentQuestion = null;
      
      if (questionsAtCurrentCheckpoint < questionsPerCheckpoint && questionsAnswered < totalQuestions) {
        showQuestion();
      } else {
        if (correctAtCheckpoint === questionsPerCheckpoint) {
          checkpointMessage = 'all correct :)';
        } else if (correctAtCheckpoint === 0) {
          checkpointMessage = 'all wrong :(';
        } else {
          checkpointMessage = 'one correct';
        }
        checkpointMessageTimer = 2000;
        correctAtCheckpoint = 0;
        
        if (currentCheckpoint >= totalCheckpoints) {
          if (collectedTrashItems.length > 0) {
            startSortingMinigame();
          } else {
            coins += sessionCoins + maps[selectedMap].completionBonus + trashCollected;
            saveGame();
            window.parent.postMessage({ type: 'score', value: coins }, '*');
            gameState = 'victory';
            playMusicForState('victory');
          }
        } else {
          gameState = 'playing';
          playMusicForState('playing');
          checkpointTimer = 0;
        }
      }
    }

    function startSortingMinigame() {
      sortingTimer = 20000; 
      sortingScore = 0;
      sortingItemIndex = 0;
      sortingFeedback = '';
      sortingFeedbackTimer = 0;
      collectedTrashItems = collectedTrashItems.sort(() => Math.random() - 0.5);
      sortingCurrentItem = collectedTrashItems[0] || null;
      gameState = 'sorting';
      playMusicForState('sorting');
    }

    function handleSortingBinClick(binIndex) {
      if (!sortingCurrentItem || sortingTimer <= 0) return;
      
      const selectedBin = sortingBins[binIndex].key;
      const correctBin = trashBinMapping[sortingCurrentItem] || 'general';
      
      if (selectedBin === correctBin) {
        sortingScore += 10;
        sortingFeedback = '✓ Correct! +10';
        sortingFeedbackTimer = 500;
      } else {
        sortingScore -= 5;
        sortingFeedback = '✗ Wrong! -5';
        sortingFeedbackTimer = 500;
      }
      
      sortingItemIndex++;
      if (sortingItemIndex < collectedTrashItems.length) {
        sortingCurrentItem = collectedTrashItems[sortingItemIndex];
      } else {
        sortingCurrentItem = null;
      }
    }

    function finishSortingMinigame() {
      const bonusCoins = Math.max(0, sortingScore);
      coins += sessionCoins + maps[selectedMap].completionBonus + trashCollected + bonusCoins;
      saveGame();
      window.parent.postMessage({ type: 'score', value: coins }, '*');
      gameState = 'victory';
      playMusicForState('victory');
    }

    function updateSorting(deltaTime) {
      if (gameState !== 'sorting') return;
      
      sortingTimer -= deltaTime;
      if (sortingFeedbackTimer > 0) sortingFeedbackTimer -= deltaTime;
      
      if (sortingTimer <= 0 || sortingCurrentItem === null) {
        finishSortingMinigame();
      }
    }

    function drawSorting() {
      ctx.fillStyle = 'rgba(0,0,0,0.95)';
      ctx.fillRect(0, 0, 400, 600);
      
      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 28px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🗑️ SORT THE TRASH! 🗑️', 200, 50);
      
      const timerWidth = (sortingTimer / 20000) * 300;
      ctx.fillStyle = '#333';
      ctx.fillRect(50, 80, 300, 20);
      ctx.fillStyle = sortingTimer > 5000 ? '#4ade80' : '#ef4444';
      ctx.fillRect(50, 80, timerWidth, 20);
      ctx.fillStyle = '#fff';
      ctx.font = '14px Arial';
      ctx.fillText(`${Math.ceil(sortingTimer / 1000)}s`, 200, 95);
      
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 24px Arial';
      ctx.fillText(`Score: ${sortingScore}`, 200, 130);
      
      if (sortingCurrentItem) {

      } else {

      }
      
      if (sortingFeedbackTimer > 0 && sortingFeedback) {
        ctx.fillStyle = sortingFeedback.includes('Correct') ? '#4ade80' : '#ef4444';
        ctx.font = 'bold 20px Arial';
        ctx.fillText(sortingFeedback, 200, 330);
      }
      
      const binWidth = 85;
      const binStartX = 20;
      const binY = 380;
      
      sortingBins.forEach((bin, i) => {
        const x = binStartX + i * (binWidth + 10);
        ctx.fillStyle = bin.color;
        ctx.fillRect(x, binY, binWidth, 100);
        ctx.strokeStyle = '#fff';

        ctx.strokeRect(x, binY, binWidth, 100);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Arial';
        ctx.fillText(bin.name, x + binWidth/2, binY + 80);
        ctx.fillStyle = '#ccc';
        ctx.font = '10px Arial';
        ctx.fillText(`Press ${i + 1}`, x + binWidth/2, binY + 95);
      });
      
      ctx.fillStyle = '#888';
      ctx.font = '12px Arial';
      ctx.fillText('Click a bin or press 1-4 to sort', 200, 520);
      ctx.textAlign = 'left';
    }

    function spawnTrash() {
      if (Math.random() < 0.035) {
        const types = ['🗑️', '📄', '🥤', '🍔', '📦', '🛍️', '🍾', '🫙', '🧴', '📰', '🍕', '🥛'];
        trash.push({
          x: 113 + Math.floor(Math.random() * 3) * 87,
          y: -30,
          type: types[Math.floor(Math.random() * types.length)]
        });
      }
    }

    function spawnNitro() {
      if (Math.random() < 0.002 && currentNitro < 3) {
        nitroPickups.push({
          x: 113 + Math.floor(Math.random() * 3) * 87,
          y: -30
        });
      }
    }

    function getLaneX(lane) {
      return 113 + lane * 87;
    }

    function update(deltaTime) {
      if (gameState === 'countdown') {
        countdownTimer += deltaTime;
        if (countdownTimer >= 1000) {
          countdownTimer = 0;
          countdown--;
          if (countdown <= 0) gameState = 'playing';
        }
        return;
      }

      if (gameState !== 'playing') return;

      if (boostEffect > 0) boostEffect -= deltaTime;
      if (stallEffect > 0) stallEffect -= deltaTime;
      if (checkpointMessageTimer > 0) checkpointMessageTimer -= deltaTime;
      if (invincibleTimer > 0) {
        invincibleTimer -= deltaTime;
        if (invincibleTimer <= 0) invincible = false;
      }

      if (nitroActive) {
        nitroTimer -= deltaTime;
        if (nitroTimer <= 0) nitroActive = false;
      }

      const checkpointSpeed = nitroActive ? 2.5 : 1;
      checkpointTimer += deltaTime * checkpointSpeed;
      
      const animationLeadTime = 4000;
      if (checkpointTimer >= checkpointInterval - animationLeadTime && !showCheckpoint && currentCheckpoint < totalCheckpoints) {
        showCheckpoint = true;
        checkpointY = -60;
      }
      
      if (checkpointTimer >= checkpointInterval && currentCheckpoint < totalCheckpoints) {
        questionsAtCurrentCheckpoint = 0;
        correctAtCheckpoint = 0;
        currentCheckpoint++;
        showCheckpoint = false;
        checkpointY = -60;
        showQuestion();
      }

      if (showCheckpoint) {
        const animSpeed = nitroActive ? 3.75 : 1.5;
        checkpointY += animSpeed;
        if (checkpointY >= 300) {
          showCheckpoint = false;
          checkpointY = -60;
        }
      }

      const baseSpeed = 0.008;
      const currentPlayerSpeed = baseSpeed * playerSpeed * (nitroActive ? 2.5 : 1) * (boostEffect > 0 ? 1.5 : 1) * (stallEffect > 0 ? 0.3 : 1);

      playerProgress += currentPlayerSpeed * deltaTime * 0.1;

      const scrollSpeed = (0.5 + playerSpeed) * (nitroActive ? 2 : 1) * (stallEffect > 0 ? 0.3 : 1);
      roadOffset += scrollSpeed;
      if (roadOffset >= 60) roadOffset = 0;

      const targetX = getLaneX(player.lane);
      player.x += (targetX - player.x) * 0.12;
      
      const targetY = 500 - (playerProgress / 100) * 350;
      player.y = targetY;

      spawnTrash();
      spawnNitro();

      const trashSpeed = (2.5 + playerSpeed * 2.5) * (nitroActive ? 2.5 : 1);
      trash = trash.filter(t => {
        t.y += trashSpeed;
        if (t.y >= player.y - 20 && t.y <= player.y + 20) {
          const playerX = getLaneX(player.lane);
          if (Math.abs(t.x - playerX) < 30) {
            trashCollected++;
            collectedTrashItems.push(t.type);
            sessionCoins++;
            return false;
          }
        }
        return t.y < 650;
      });

      nitroPickups = nitroPickups.filter(n => {
        n.y += trashSpeed;
        if (n.y >= player.y - 25 && n.y <= player.y + 25) {
          const playerX = getLaneX(player.lane);
          if (Math.abs(n.x - playerX) < 35 && currentNitro < 3) {
            currentNitro++;
            return false;
          }
        }
        return n.y < 650;
      });
    }

    function updateQuestion(deltaTime) {
      if (gameState !== 'question') return;
      questionTimer -= deltaTime;
      if (questionTimer <= 0) {
        lives--;
        if (lives <= 0) {
          coins += sessionCoins + 5;
          saveGame();
          window.parent.postMessage({ type: 'score', value: coins }, '*');
          gameState = 'gameOver';
          playMusicForState('gameOver');
          return;
        }
        questionsAnswered++;
        currentQuestion = null;
        gameState = 'playing';
        playMusicForState('playing');
        checkpointTimer = 0;
      }
    }

      ctx.fillStyle = '#ffd700';
      ctx.font = '16px Arial';
      ctx.fillText(`Total 💰 ${coins}`, 200, 65);
      
      const skinKeys = Object.keys(skins);
      skinKeys.forEach((key, i) => {
        const skin = skins[key];
        const y = 100 + i * 55;
        if (y > 480) return;
        
        const unlocked = coins >= skin.price;
        const selected = selectedSkin === key;
        
        ctx.fillStyle = selected ? '#4ade80' : unlocked ? '#333' : '#222';
        ctx.fillRect(20, y, 360, 45);
        
        if (skin.color === 'rainbow') {
          const gradient = ctx.createLinearGradient(30, y + 12, 50, y + 32);
          gradient.addColorStop(0, '#ff0000');
          gradient.addColorStop(0.5, '#00ff00');
          gradient.addColorStop(1, '#0000ff');
          ctx.fillStyle = gradient;
        } else {
          ctx.fillStyle = skin.color;
        }
        ctx.fillRect(30, y + 12, 20, 20);
        
        ctx.fillStyle = '#fff';
        ctx.font = '14px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(skin.name, 60, y + 28);
        
        ctx.textAlign = 'right';
        if (unlocked) {
          ctx.fillStyle = selected ? '#000' : '#4ade80';
          ctx.fillText(selected ? '✓ Selected' : 'Select', 370, y + 28);
        } else {
          ctx.fillStyle = '#ff6b6b';
          ctx.fillText(`Unlocks at 💰 ${skin.price}`, 370, y + 28);
        }
      });
      
      ctx.fillStyle = '#555';
      ctx.fillRect(150, 540, 100, 40);
      ctx.fillStyle = '#fff';
      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('← Back', 200, 565);
      ctx.textAlign = 'left';
    }

    function drawQuestion() {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, 400, 600);
      
      ctx.fillStyle = '#2a2a4a';
      ctx.fillRect(20, 50, 360, 480);
      
      const timerPercent = questionTimer / 8000;
      ctx.fillStyle = '#333';
      ctx.fillRect(40, 70, 320, 20);
      ctx.fillStyle = timerPercent > 0.3 ? '#4ade80' : '#ff6b6b';
      ctx.fillRect(40, 70, 320 * timerPercent, 20);
      
      ctx.fillStyle = '#fff';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`Bot answers in: ${(questionTimer / 1000).toFixed(1)}s`, 200, 85);
      
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 20px Arial';
      ctx.fillText('🏁 CHECKPOINT 🏁', 200, 130);
      
      ctx.fillStyle = '#fff';
      ctx.font = '16px Arial';
      ctx.fillText('Which bin should this go in?', 200, 170);
      
      ctx.font = 'bold 22px Arial';
      ctx.fillText(currentQuestion.item, 200, 230);
      
      ctx.font = '14px Arial';
      ctx.fillStyle = '#888';
      ctx.fillText(`Question ${questionsAnswered + 1} of ${totalQuestions}`, 200, 270);
      
      const answers = currentQuestion.options;
      const colors = ['#3b82f6', '#22c55e', '#6b7280', '#f59e0b'];
      const emojis = ['♻️', '🌱', '🗑️', '☢️'];
      
      answers.forEach((ans, i) => {
        const y = 310 + i * 50;
        ctx.fillStyle = colors[i];
        ctx.fillRect(50, y, 300, 40);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Arial';
        ctx.fillText(`${i + 1}. ${emojis[i]} ${ans}`, 200, y + 27);
      });
      
      ctx.fillStyle = '#888';
      ctx.font = '12px Arial';
      ctx.fillText('Press 1-4 or click to answer', 200, 575);
      ctx.textAlign = 'left';
    }

    function drawCountdown() {
      drawRoad();
      drawCar(getLaneX(player.lane), player.y, true);
      
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, 400, 600);
      
      ctx.fillStyle = countdown > 0 ? '#ffd700' : '#4ade80';
      ctx.font = 'bold 100px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(countdown > 0 ? countdown : 'GO!', 200, 350);
      ctx.textAlign = 'left';
    }

    function drawPaused() {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, 0, 400, 600);
      
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', 200, 200);
      
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(120, 280, 160, 40);
      ctx.fillStyle = '#000';
      ctx.font = '18px Arial';
      ctx.fillText('Resume', 200, 307);
      
      ctx.fillStyle = '#666';
      ctx.fillRect(120, 340, 160, 40);
      ctx.fillStyle = '#fff';
      ctx.fillText('Quit', 200, 367);
      
      ctx.fillStyle = '#ff6b6b';
      ctx.font = '12px Arial';
      ctx.fillText('Warning: If you quit, the coins', 200, 410);
      ctx.fillText("you've gained will be lost.", 200, 425);
      ctx.textAlign = 'left';
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.9)';
      ctx.fillRect(0, 0, 400, 600);
      
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', 200, 180);
      
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText(lives <= 0 ? 'You ran out of lives!' : 'The bot beat you!', 200, 230);
      
      ctx.fillStyle = '#ffd700';
      ctx.font = '24px Arial';
      ctx.fillText(`💰 +${sessionCoins + 5} coins`, 200, 290);
      
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(120, 400, 160, 50);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 20px Arial';
      ctx.fillText('Continue', 200, 432);
      ctx.textAlign = 'left';
    }

    function drawVictory() {
      ctx.fillStyle = 'rgba(0,0,0,0.9)';
      ctx.fillRect(0, 0, 400, 600);
      
      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 40px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🏆 VICTORY! 🏆', 200, 180);
      
      ctx.fillStyle = '#fff';
      ctx.font = '20px Arial';
      ctx.fillText('You won the race!', 200, 230);
      
      ctx.font = '24px Arial';
      ctx.fillText(`Correct: ${correctAnswers}/${questionsAnswered}`, 200, 270);
      ctx.fillText(`🗑️ Trash Collected: ${trashCollected}`, 200, 305);
      
      const sortingBonus = Math.max(0, sortingScore);
      if (sortingBonus > 0) {
        ctx.fillStyle = '#4ade80';
        ctx.fillText(`♻️ Sorting Bonus: +${sortingBonus}`, 200, 340);
      }
      
      const totalCoins = sessionCoins + maps[selectedMap].completionBonus + trashCollected + sortingBonus;
      ctx.fillStyle = '#ffd700';
      ctx.fillText(`💰 +${totalCoins} coins`, 200, 375);
      
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(120, 420, 160, 50);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 20px Arial';
      ctx.fillText('Continue', 200, 452);
      ctx.textAlign = 'left';
    }

    function draw() {
      ctx.clearRect(0, 0, 400, 600);
      
      switch (gameState) {
        case 'menu': drawMenu(); break;
        case 'mapSelect': drawMapSelect(); break;
        case 'garage': drawGarage(); break;
        case 'countdown': drawCountdown(); break;
        case 'playing':
          drawRoad();
          drawCheckpoint();
          drawTrash();
          drawNitroPickups();
          drawCar(player.x, player.y, true);
          drawHUD();
          break;
        case 'question':
          drawRoad();
          drawCar(player.x, player.y, true);
          drawQuestion();
          break;
        case 'paused':
          drawRoad();
          drawCar(player.x, player.y, true);
          drawHUD();
          drawPaused();
          break;
        case 'gameOver': drawGameOver(); break;
        case 'victory': drawVictory(); break;
        case 'sorting': drawSorting(); break;
      }
      
      drawMusicButton();
    }

    function gameLoop(timestamp) {
      const deltaTime = Math.min(timestamp - lastTime, 100);
      lastTime = timestamp;
      
      update(deltaTime);
      updateQuestion(deltaTime);
      updateSorting(deltaTime);
      draw();
      
      requestAnimationFrame(gameLoop);
    }

    // Start menu music on first user interaction (browser autoplay policy)
    function startMenuMusic() {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      playMusicForState('menu');
      document.removeEventListener('click', startMenuMusic);
      document.removeEventListener('keydown', startMenuMusic);
    }
    document.addEventListener('click', startMenuMusic);
    document.addEventListener('keydown', startMenuMusic);

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
